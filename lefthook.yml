pre-commit:
    parallel: false
    jobs:
        - name: type-check
          run: bun x tsc --noEmit

        - name: lint
          glob: "*.{ts,js,tsx,jsx,json}"
          run: bun x oxfmt --check {staged_files}

        - name: format
          glob: "*.{ts,js,tsx,jsx,json,css,md}"
          run: bun x oxlint {staged_files}

pre-push:
    jobs:
        - name: package audit
          run: bun audit

        - name: type-check
          run: bun x tsc --noEmit

        - name: lint
          run: bun x oxlint

        - name: format
          run: bun x oxfmt

        - name: test
          run: bun test --pass-with-no-tests

